<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web NFC Receiver (Debug)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #receivedData {
            width: 100%;
            height: 200px;
            margin-bottom: 10px;
            background-color: #eee;
            border: 1px solid #ccc;
            padding: 5px;
            white-space: pre-wrap; /* Preserve formatting */
            word-wrap: break-word; /* Wrap long lines */
            font-family: monospace; /* Better for JSON */
        }
        #status { margin-top: 15px; font-weight: bold; }
        button { padding: 10px 15px; font-size: 1em; cursor: pointer; margin-bottom: 10px; }
        .error { color: red; }
        .success { color: green; }
        .info { color: blue; }
    </style>
</head>
<body>

    <h1>Web NFC Receiver (Debug)</h1>
    <p>This page will listen for incoming JSON data via NFC.</p>

    <button id="scanButton">Start/Restart NFC Scan</button>
    <div id="status">Status: Initializing...</div>

    <h2>Received Data:</h2>
    <pre id="receivedData">Waiting for data...</pre>

    <script>
        console.log("RECEIVER SCRIPT START");

        const scanButton = document.getElementById('scanButton');
        const statusDiv = document.getElementById('status');
        const receivedDataDiv = document.getElementById('receivedData');
        let ndefReader = null; // Keep track of the reader instance

        // --- Check if elements were found ---
        console.log("Receiver Elements:", { scanButton, statusDiv, receivedDataDiv });
        if (!scanButton || !statusDiv || !receivedDataDiv) {
             console.error("ERROR: One or more HTML elements not found!");
             if(statusDiv) statusDiv.textContent = "Error: Page elements missing.";
        }

        // --- Function to update status (with logging) ---
        function updateReceiverStatus(message, type = 'info') {
            console.log(`Receiver Status Update: ${message} (Type: ${type})`);
            if (statusDiv) {
                statusDiv.textContent = `Status: ${message}`;
                statusDiv.className = type;
            } else {
                 console.error("Cannot update status, statusDiv not found.");
            }
        }

        // --- Function to start scanning (defined before use) ---
        async function startNfcReading() {
            // Check support *inside* the function as well, in case it's called later
            if (!('NDEFReader' in window)) {
                updateReceiverStatus('Web NFC Reading is not supported.', 'error');
                return;
            }

            if (ndefReader) {
                console.log("RECEIVER: Scan button clicked - potentially restarting scan by creating new NDEFReader.");
                // No explicit stop method, creating a new one is the way
            }

            try {
                updateReceiverStatus('Initializing NFC Reader...', 'info');
                console.log("RECEIVER: Creating NDEFReader instance.");
                ndefReader = new NDEFReader(); // Create a new reader instance

                // Event listener for reading errors
                ndefReader.addEventListener("readingerror", (event) => {
                    console.error("RECEIVER NFC Reading Error:", event);
                    updateReceiverStatus(`Error reading NFC tag: ${event.message || 'Unknown error'}`, 'error');
                });

                // Event listener for successful reads
                ndefReader.addEventListener("reading", ({ message, serialNumber }) => {
                    console.log("RECEIVER: 'reading' event received.", { serialNumber, message });
                    updateReceiverStatus(`NFC Tag Read (Serial: ${serialNumber || 'N/A'}). Processing...`, 'info');
                    if(receivedDataDiv) receivedDataDiv.textContent = 'Processing incoming data...';

                    let jsonRecordFound = false;
                    for (const record of message.records) {
                        console.log(`RECEIVER: Record type: ${record.recordType}, MIME type: ${record.mediaType}, ID: ${record.id}`);

                        if (record.recordType === "mime" && record.mediaType === "application/json") {
                            jsonRecordFound = true;
                            updateReceiverStatus('Found application/json record. Decoding...', 'info');
                            try {
                                const decoder = new TextDecoder(record.encoding || 'utf-8');
                                const jsonString = decoder.decode(record.data);
                                console.log("RECEIVER: Decoded JSON String:", jsonString);
                                const receivedJson = JSON.parse(jsonString);

                                console.log("RECEIVER: Parsed JSON Object:", receivedJson);
                                if(receivedDataDiv) receivedDataDiv.textContent = JSON.stringify(receivedJson, null, 2); // Pretty print
                                updateReceiverStatus('JSON data received successfully!', 'success');

                            } catch (e) {
                                console.error("RECEIVER: Error processing received JSON:", e);
                                if(receivedDataDiv) receivedDataDiv.textContent = `Error: Could not parse received JSON data.\nRaw data: ${record.data ? new TextDecoder().decode(record.data) : 'empty'}\nError: ${e.message}`;
                                updateReceiverStatus('Error parsing received JSON data.', 'error');
                            }
                            break; // Process only the first JSON record found
                        }
                    }

                    if (!jsonRecordFound) {
                         console.log('RECEIVER: NFC tag read, but no "application/json" record found.');
                         updateReceiverStatus('NFC tag read, but no compatible JSON data found.', 'info');
                         if(receivedDataDiv) receivedDataDiv.textContent = 'No compatible JSON data found on the tag.';
                    }
                });

                // Start scanning
                console.log("RECEIVER: Calling ndefReader.scan()...");
                await ndefReader.scan();
                console.log("RECEIVER: ndefReader.scan() promise resolved.");
                updateReceiverStatus('NFC Scan active. Bring sender device close.', 'success'); // Use success color for active scan
                if(scanButton) scanButton.textContent = 'Scanning... (Re-click to Re-initiate)';


            } catch (error) {
                console.error("RECEIVER: NFC Scan Initialization Error:", error);
                updateReceiverStatus(`Error starting NFC scan: ${error.message}`, 'error');
                 ndefReader = null; // Clear reader instance on error
                 if(scanButton) scanButton.textContent = 'Scan Failed - Retry?';
            }
        }


        // --- Check for NDEFReader support (with logging) ---
        console.log("RECEIVER: Checking for NDEFReader support...");
        console.log("RECEIVER: Does 'NDEFReader' exist in window?", 'NDEFReader' in window);
        // console.log("RECEIVER: Window object:", window); // Uncomment for verbose logging if needed

        if (!('NDEFReader' in window)) {
            console.error("RECEIVER: NDEFReader check FAILED. Entering 'not supported' block.");
            updateReceiverStatus('Web NFC Reading is not supported on this browser/device.', 'error');
            if (scanButton) scanButton.disabled = true;
        } else {
             console.log("RECEIVER: NDEFReader check PASSED. Entering 'supported' block.");
             updateReceiverStatus('Web NFC is supported. Click button to start scan.', 'info');
             if (scanButton) {
                 scanButton.disabled = false; // Ensure button is enabled
                 // Add event listener only if supported and button exists
                 scanButton.addEventListener('click', startNfcReading);
                 console.log("RECEIVER: Scan button event listener added.");
             } else {
                  console.error("RECEIVER: Cannot add listener, scanButton not found.");
             }
             // Optionally auto-start scan on load if supported
             // console.log("RECEIVER: Attempting auto-scan on load.");
             // startNfcReading(); // Uncomment this line to try auto-starting
        }

        console.log("RECEIVER SCRIPT END");
    </script>

</body>

</html>
